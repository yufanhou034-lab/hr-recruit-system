<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 同一份页面同时被 Electron 与网页版加载：
       Electron 下 window.api 由 preload 注入且脚本一律本地加载；网页版才会用到 CDN 解析库。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://registry.npmmirror.com; worker-src 'self' blob:; connect-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://registry.npmmirror.com https://tessdata.projectnaptha.com data: blob:; font-src 'self' data:" />
  <title>HR 招聘管理系统</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <span class="brand-logo">🧑‍💼</span>
      <div class="brand-text">
        <h1>HR 招聘管理系统</h1>
        <span class="brand-sub">本地运行 · 数据不出本机</span>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>

  <main id="views">
    <section class="pane" data-pane="dashboard"></section>
    <section class="pane" data-pane="pool"></section>
    <section class="pane" data-pane="jobs"></section>
    <section class="pane" data-pane="screening"></section>
    <section class="pane" data-pane="kanban"></section>
    <section class="pane" data-pane="interview"></section>
    <section class="pane" data-pane="talent"></section>
    <section class="pane" data-pane="settings"></section>
  </main>

  <div class="status-bar">
    <span id="statusText">就绪</span>
    <span id="statusRight"></span>
  </div>

  <div id="toasts" class="toasts"></div>
  <div id="modalRoot" class="modal-root"></div>
  <div id="dropMask" class="drop-mask">
    <div class="drop-mask-inner">
      <div class="drop-mask-icon">📥</div>
      <div>松开鼠标，导入简历文件</div>
    </div>
  </div>

  <script src="core/utils.js"></script>
  <script src="core/browser-parse.js"></script>
  <script src="core/bridge-web.js"></script>
  <script src="core/scoring.js"></script>
  <script src="core/extract.js"></script>
  <script src="core/ui.js"></script>
  <script src="core/data.js"></script>
  <script src="core/demo-data.js"></script>
  <script src="modules/dashboard.js"></script>
  <script src="modules/pool.js"></script>
  <script src="modules/jobs.js"></script>
  <script src="modules/screening.js"></script>
  <script src="modules/kanban.js"></script>
  <script src="modules/interview.js"></script>
  <script src="modules/talent.js"></script>
  <script src="modules/settings.js"></script>
  <script src="app.js"></script>
</body>
</html>
