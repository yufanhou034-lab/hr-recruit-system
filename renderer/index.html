<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 同一份页面同时被 Electron 与网页版加载：
       Electron 下 window.api 由 preload 注入且脚本一律本地加载；网页版才会用到 CDN 解析库。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://registry.npmmirror.com; worker-src 'self' blob:; connect-src 'self' https: https://cdn.jsdelivr.net https://unpkg.com https://registry.npmmirror.com https://tessdata.projectnaptha.com data: blob:; font-src 'self' data:" />
  <title>HR 招聘管理系统</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- 左侧导航（可折叠为 56px 图标条） -->
    <aside class="sidebar" id="sidebar">
      <div class="sb-head">
        <span class="sb-logo" id="sbLogo"></span>
        <span class="sb-name">HR 招聘管理系统</span>
      </div>
      <nav class="sb-nav" id="tabs"></nav>
      <div class="sb-foot">
        <button class="sb-import" id="sbImport"><span>导入简历</span></button>
        <div class="sb-foot-row">
          <button class="sb-ghost" id="themeBtn" title="切换深色模式"></button>
          <button class="sb-ghost" id="sbToggle" title="收起侧边栏（Ctrl+B）"></button>
        </div>
      </div>
    </aside>

    <div class="app-main">
      <div class="topbar">
        <span class="topbar-title" id="pageTitle">仪表盘</span>
        <span class="spacer"></span>
        <!-- 快捷键提示：hover 展开 -->
        <div class="kbd-hint" id="kbdHint" tabindex="0">
          <span class="kbd-hint-btn"></span>
          <div class="kbd-pop">
            <div class="kbd-row"><span>全局搜索</span><kbd>Ctrl</kbd><kbd>K</kbd></div>
            <div class="kbd-row"><span>切换模块</span><kbd>Ctrl</kbd><kbd>1</kbd><span class="kbd-dim">~</span><kbd>8</kbd></div>
            <div class="kbd-row"><span>收起侧边栏</span><kbd>Ctrl</kbd><kbd>B</kbd></div>
            <div class="kbd-row"><span>打开选中行</span><kbd>Enter</kbd></div>
            <div class="kbd-row"><span>关闭弹窗</span><kbd>Esc</kbd></div>
          </div>
        </div>
      </div>

      <main id="views">
        <section class="pane" data-pane="dashboard"></section>
        <section class="pane" data-pane="pool"></section>
        <section class="pane" data-pane="jobs"></section>
        <section class="pane" data-pane="screening"></section>
        <section class="pane" data-pane="kanban"></section>
        <section class="pane" data-pane="interview"></section>
        <section class="pane" data-pane="talent"></section>
        <section class="pane" data-pane="settings"></section>
      </main>

      <div class="status-bar">
        <span id="statusText">就绪</span>
        <span id="statusRight"></span>
      </div>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>
  <div id="modalRoot" class="modal-root"></div>
  <div id="paletteRoot" class="palette-root"></div>
  <div id="ctxRoot" class="ctx-root"></div>
  <div id="dropMask" class="drop-mask">
    <div class="drop-mask-inner">
      <div class="drop-mask-icon" id="dropIcon"></div>
      <div>松开鼠标，导入简历文件</div>
    </div>
  </div>

  <script src="core/utils.js"></script>
  <script src="core/icons.js"></script>
  <script src="core/browser-parse.js"></script>
  <script src="core/bridge-web.js"></script>
  <script src="core/scoring.js"></script>
  <script src="core/ai.js"></script>
  <script src="core/reminder.js"></script>
  <script src="core/extract.js"></script>
  <script src="core/ui.js"></script>
  <script src="core/data.js"></script>
  <script src="core/demo-data.js"></script>
  <script src="modules/dashboard.js"></script>
  <script src="modules/pool.js"></script>
  <script src="modules/jobs.js"></script>
  <script src="modules/screening.js"></script>
  <script src="modules/kanban.js"></script>
  <script src="modules/interview.js"></script>
  <script src="modules/talent.js"></script>
  <script src="modules/settings.js"></script>
  <script src="modules/palette.js"></script>
  <script src="modules/contextmenu.js"></script>
  <script src="app.js"></script>
</body>
</html>
